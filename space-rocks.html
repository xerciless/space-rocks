const TC=new Map();
function tmpl(src){

const THING={id:'',name:'Object',kind:'sprite',tags:'',x:0,y:0,z:0,w:64,h:64,d:64,direction:90,rx:0,ry:0,rz:0,size:100,shape:'rect',color:'#5b9cff',costumes:[],costume:0,animFps:0,opacity:100,visible:true,text:'Text',fontSize:32,font:'sans',bold:true,align:'center',hud:false,rotStyle:'all',body:'ghost',bounce:0,tile:1,radius:0,model:'',flipX:false,outline:'#000000',outlineW:0,color2:'',glow:0,texMode:'stretch',texScale:1,faceMode:'same',texTop:'',texBottom:'',slide:0,anims:[],clips:[],layer:'',draggable:false,locked:false,scripts:[]};
function thingDefaults(mode,kind){
  const d=Object.assign({},THING);d.costumes=[];d.scripts=[];d.kind=kind||'sprite';
  if(mode==='3d'&&d.kind==='mesh')Object.assign(d,{w:1,h:1,d:1,shape:'box',color:'#7aa2ff'});
  if(d.kind==='text')Object.assign(d,{w:200,h:40,color:'#ffffff',text:'Text',hud:mode==='3d'});
  return d;
}
let IDN=0;
const nid=()=>Date.now().toString(36).slice(-4)+(++IDN).toString(36)+Math.random().toString(36).slice(2,6);
function normThing(mode,t){
  const d=thingDefaults(mode,t.kind);const o=Object.assign(d,t);
  if(mode==='2d'&&o.kind==='mesh')o.kind='sprite';
  if(mode==='3d'&&o.kind==='sprite'){o.hud=true;}
  o.costumes=Array.isArray(o.costumes)?o.costumes.slice():[];o.anims=Array.isArray(o.anims)?o.anims:[];o.clips=Array.isArray(o.clips)?o.clips:[];o.scripts=Array.isArray(o.scripts)?o.scripts:[];
  if(!o.id)o.id=nid();
  for(const s of o.scripts){if(!s.id)s.id=nid();if(!Array.isArray(s.blocks))s.blocks=[];s.x=num(s.x);s.y=num(s.y);}
  return o;
}
const TEXTBOX=new WeakMap();
const fx0=()=>({color:0,brightness:0,ghost:0,saturation:0,blur:0});
function ext(t){
  const s=(t.size==null?100:num(t.size))/100;let w=t.w,h=t.h,d=t.d;
  if(t.kind==='text'){const m=TEXTBOX.get(t);if(m){w=m[0];h=m[1];}}
  return[Math.abs(num(w)*s)/2||.001,Math.abs(num(h)*s)/2||.001,Math.abs(num(d==null?w:d)*s)/2||.001];
}
function hitBox(t,px,py){const e=ext(t);let cx=t.x;if(t.kind==='text'){const m=TEXTBOX.get(t);if(m)cx+=m[2]*(t.size==null?1:t.size/100);}return Math.abs(px-cx)<=e[0]&&Math.abs(py-t.y)<=e[1];}

/* ================= things ================= */
let CLN=0;
class Thing{
  constructor(game,src,isClone){
    const base=thingDefaults(game.mode,src.kind);
    for(const k in base){const v=src[k];this[k]=v===undefined?base[k]:(Array.isArray(v)?v.slice():v);}
    this.scripts=src.scripts||[];this.id=isClone?String(src.id).split('~')[0]+'~'+(++CLN):src.id;
    this.game=game;this.isClone=!!isClone;this._alive=true;
    this.vx=isClone?num(src.vx):0;this.vy=isClone?num(src.vy):0;this.vz=isClone?num(src.vz):0;
    this.onGround=false;this.ground=null;this._say=null;this._animT=0;this._touch={};this._when={};
    this._locals=Object.create(null);this._fx=isClone&&src._fx?Object.assign(fx0(),src._fx):fx0();this._anim=null;this._clip=null;this._wig=null;this._wasGround=false;this._slope=0;
    this._pen=isClone&&src._pen?Object.assign({},src._pen):null;
    if(isClone&&src._locals)for(const k in src._locals){const v=src._locals[k];this._locals[k]=Array.isArray(v)?v.slice():v;}
    this._px=this.x;this._py=this.y;this._pz=this.z;
  }
  get costumeName(){const a=this.game.asset(this.costumes[this.costume]);return a?a.name:'';}
  get is3d(){return this.game.mode==='3d';}
  move(n){if(this.is3d){this.x+=Math.sin(this.ry*D2R)*n;this.z-=Math.cos(this.ry*D2R)*n;}else{this.x+=Math.sin(this.direction*D2R)*n;this.y+=Math.cos(this.direction*D2R)*n;}}
  forward(n){if(this.is3d){this.vx=Math.sin(this.ry*D2R)*n;this.vz=-Math.cos(this.ry*D2R)*n;}else{this.vx=Math.sin(this.direction*D2R)*n;this.vy=Math.cos(this.direction*D2R)*n;}}
  turn(n){if(this.is3d)this.ry+=n;else this.direction=wrapDir(this.direction+n);}
  setPos(ax,v){this[ax]=v;this['_p'+ax]=v;}
  goTo(x,y,z){this.setPos('x',num(x));this.setPos('y',num(y));if(z!==undefined)this.setPos('z',num(z));}
  pointTowards(t){const p=this.game.resolvePoint(this,t);if(!p)return;if(this.is3d)this.ry=Math.atan2(p.x-this.x,-(p.z-this.z))*R2D;else this.direction=wrapDir(Math.atan2(p.x-this.x,p.y-this.y)*R2D);}
  jump(f){if(this.onGround){this.vy=f;this.onGround=false;}}
  say(text,secs){this._say=(text===''||text==null)?null:{text:String(text),until:secs?this.game.time+secs:Infinity};}
  setCostume(v){
    const cs=this.costumes;
    if(typeof v==='number'||(/^\s*\d+\s*$/.test(String(v))&&!this.game.asset(v))){if(cs.length){const n=Math.floor(num(v));this.costume=((n-1)%cs.length+cs.length)%cs.length;}return;}
    const a=this.game.asset(v,'image');if(!a)return;let i=cs.indexOf(a.id);if(i<0){cs.push(a.id);i=cs.length-1;}this.costume=i;if(this.kind==='sprite')this.shape='image';
  }
  nextCostume(){if(this.costumes.length)this.costume=(this.costume+1)%this.costumes.length;}
  strafe(n){if(this.is3d){this.x+=Math.cos(this.ry*D2R)*n;this.z+=Math.sin(this.ry*D2R)*n;}else{this.x+=Math.cos(this.direction*D2R)*n;this.y-=Math.sin(this.direction*D2R)*n;}}
  playAnim(name){const L=this.anims||[];const a=L.find(x=>x.name===name)||L[Math.floor(num(name))-1];if(!a||!a.frames||!a.frames.length)return;this._anim={a,name:a.name,i:0,t:0,loops:0,done:false};this.setCostume(a.frames[0]);}
  stepAnim(){const A=this._anim;if(!A||A.done)return;A.t+=(num(A.a.fps)||8)/60;while(A.t>=1){A.t-=1;A.i++;if(A.i>=A.a.frames.length){A.loops++;if(A.a.loop===false){A.i=A.a.frames.length-1;A.done=true;break;}A.i=0;}this.setCostume(A.a.frames[A.i]);}}
  wiggle(n,s){this._wig={amt:n,end:this.game.time+(s||.4)};}
  playClip(name){const L=this.clips||[];const c=L.find(x=>x.name===name)||L[Math.floor(num(name))-1];if(!c)return;const base={};for(const p in c.tracks)base[p]=this[p];this._clip={c,name:c.name,t:0,base,done:false,loops:0};this.applyClip();}
  stepClip(){const A=this._clip;if(!A||A.done)return;const len=Math.max(1/60,num(A.c.length)||1);A.t+=1/60;if(A.t>=len){if(A.c.loop){A.t-=len;A.loops++;}else{A.t=len;A.done=true;}}this.applyClip();}
  applyClip(){const A=this._clip,c=A.c;for(const p in c.tracks){const K=c.tracks[p];if(!K||!K.length)continue;let v=clipValue(K,A.t,p);
    if(c.relative!==false&&(p==='x'||p==='y'||p==='z'))v=num(A.base[p])+(v-clipValue(K,0,p));
    if(p==='costume'){if(v)this.setCostume(v);}else if(p==='color')this.color=v;else{this[p]=v;}}}
  hide(){this.visible=false;} show(){this.visible=true;}
